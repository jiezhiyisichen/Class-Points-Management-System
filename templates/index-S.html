<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生查询 · Class Score</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <style>
        body {
            background: #f3f4f6;
            min-height: 100vh;
            padding: 2rem 1rem;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .input-group {
            margin-bottom: 1.25rem;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 0.5rem;
        }
        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .btn-primary {
            display: block;
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(102,126,234,0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .result-card {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 16px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            display: none;
        }
        .result-card.show {
            display: block;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #764ba2;
        }
        .notes-list {
            margin-top: 0.5rem;
            padding-left: 1.25rem;
            list-style-type: disc;
            color: #4b5563;
            font-size: 0.9rem;
        }
        .notes-list li {
            margin-bottom: 0.15rem;
        }
        .alert-box {
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><i class="fa fa-arrow-left"></i> 返回首页</a>
        <div class="card">
            <h2 style="text-align:center; margin-bottom:1.75rem; color:#1e293b; font-weight:700;">
                <i class="fa fa-search" style="color:#667eea;"></i> 学生信息查询
            </h2>
            <div class="input-group">
                <label>班级账号名 <span class="text-red-500">*</span></label>
                <input type="text" id="usernameInput" placeholder="例如：ysc 或 你的班级账号">
            </div>
            <div class="input-group">
                <label>学号</label>
                <input type="text" id="studentIdInput" placeholder="输入学号（可选）">
            </div>
            <div class="input-group">
                <label>姓名</label>
                <input type="text" id="studentNameInput" placeholder="输入姓名（可选）">
            </div>
            <p style="font-size:0.8rem; color:#6b7280; margin-bottom:0.5rem;">* 学号和姓名至少填写一项</p>
            <button class="btn-primary" id="queryBtn"><i class="fa fa-search"></i> 查询学生</button>

            <div id="alertBox" class="alert-box"></div>

            <div id="resultCard" class="result-card">
                <h3 style="font-weight:700; margin-bottom:1rem; color:#1e293b;">查询结果</h3>
                <div class="flex justify-between mb-1"><span class="text-gray-600">学号：</span><strong id="resId"></strong></div>
                <div class="flex justify-between mb-1"><span class="text-gray-600">姓名：</span><strong id="resName"></strong></div>
                <div class="flex justify-between mb-1"><span class="text-gray-600">等级：</span><span id="resLevel" class="font-bold text-blue-600"></span></div>
                <div class="flex justify-between mb-1"><span class="text-gray-600">正分：</span><span id="resPos" class="text-green-600"></span></div>
                <div class="flex justify-between mb-1"><span class="text-gray-600">负分：</span><span id="resNeg" class="text-red-600"></span></div>
                <div class="flex justify-between mb-1"><span class="text-gray-600">总分：</span><span id="resTotal" class="font-bold text-lg"></span></div>
                <div class="mt-3">
                    <span class="text-gray-600">注释：</span>
                    <ul id="resNotes" class="notes-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const usernameInput = document.getElementById('usernameInput');
        const studentIdInput = document.getElementById('studentIdInput');
        const studentNameInput = document.getElementById('studentNameInput');
        const queryBtn = document.getElementById('queryBtn');
        const resultCard = document.getElementById('resultCard');
        const alertBox = document.getElementById('alertBox');

        function hideAlert() {
            alertBox.style.display = 'none';
            alertBox.className = 'alert-box';
        }
        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.className = 'alert-box alert-error';
            alertBox.style.display = 'block';
        }

        queryBtn.addEventListener('click', async () => {
            hideAlert();
            resultCard.classList.remove('show');

            const username = usernameInput.value.trim();
            const studentId = studentIdInput.value.trim();
            const studentName = studentNameInput.value.trim();

            if (!username) {
                showAlert('请输入班级账号名');
                return;
            }
            if (!studentId && !studentName) {
                showAlert('请至少输入学号或姓名');
                return;
            }

            const params = new URLSearchParams({ username });
            if (studentId) params.append('student_id', studentId);
            if (studentName) params.append('student_name', studentName);

            try {
                const res = await fetch(`/api/student-query?${params}`);
                const data = await res.json();

                if (data.success) {
                    const s = data.data.student;
                    document.getElementById('resId').textContent = s.id;
                    document.getElementById('resName').textContent = s.name;
                    document.getElementById('resLevel').textContent = 'Lv ' + s.level;
                    document.getElementById('resPos').textContent = s.positive_score;
                    document.getElementById('resNeg').textContent = s.negative_score;
                    document.getElementById('resTotal').textContent = s.total_score;
                    document.getElementById('resTotal').className = s.total_score >= 0 ? 'font-bold text-lg text-blue-600' : 'font-bold text-lg text-red-600';

                    const notesList = document.getElementById('resNotes');
                    notesList.innerHTML = '';
                    const notes = data.data.notes || [];
                    if (notes.length > 0) {
                        notes.forEach(note => {
                            const li = document.createElement('li');
                            li.textContent = `${note.id}. ${note.content}`;
                            notesList.appendChild(li);
                        });
                    } else {
                        const li = document.createElement('li');
                        li.textContent = '暂无注释';
                        notesList.appendChild(li);
                    }
                    resultCard.classList.add('show');
                } else {
                    showAlert(data.msg || '查询失败');
                }
            } catch (err) {
                showAlert('网络错误，请稍后重试');
            }
        });

        // 回车快捷
        [usernameInput, studentIdInput, studentNameInput].forEach(el => {
            el.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') queryBtn.click();
            });
        });
    </script>
</body>
</html>
